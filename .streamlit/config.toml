[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"

[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#020617"
secondaryBackgroundColor = "#121a30"
textColor = "#e2e8f0"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[ui]
hideTopBar = false
hideSidebarNav = false
