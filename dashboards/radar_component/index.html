    function exportarCarteiraFiltradaCSV() {
      // Determina escopo autorizado atual
      let carteiraEscopo = [];
      if (state.visaoAtual.startsWith("vendedora_")) {
        const cod = state.visaoAtual.replace("vendedora_", "");
        carteiraEscopo = CARTEIRA_CLIENTES.filter(c => c.CodVendedorCarteira === cod);
      } else if (state.visaoAtual.startsWith("supervisor_")) {
        const idEq = state.visaoAtual.replace("supervisor_", "");
        carteiraEscopo = CARTEIRA_CLIENTES.filter(c => c.IdEquipe === idEq);
        if (state.filtroVendedoraEscopo !== "TODAS") {
          carteiraEscopo = carteiraEscopo.filter(c => c.CodVendedorCarteira === state.filtroVendedoraEscopo);
        }
      } else {
        carteiraEscopo = state.filtroEquipeGestao === "TODAS"
          ? [...CARTEIRA_CLIENTES]
          : CARTEIRA_CLIENTES.filter(c => c.IdEquipe === state.filtroEquipeGestao);
        if (state.filtroVendedoraEscopo !== "TODAS") {
          carteiraEscopo = carteiraEscopo.filter(c => c.CodVendedorCarteira === state.filtroVendedoraEscopo);
        }
      }

      const filtrados = ordenarListaClientes(aplicarAba(carteiraEscopo.filter(passaPelosFiltrosPlanilha)));
      const cabecalho = [
        "Codigo", "Cliente", "CurvaABC", "VendedoraResponsavel", "ComprouNoMes",
        "CompradoNoMes_R$", "MediaMensal12m_R$", "UltimaCompra", "DiasSemComprar", "Contato"
      ];

      const csv = value => {
        let text=String(value ?? '');
        if (/^[=+@\-\t\r\n]/.test(text)) text="'"+text;
        return '"'+text.replace(/"/g,'""')+'"';
      };
      const linhas = filtrados.map(c => [c.CodCliFor,c.Cliente,c.CurvaABC,c.VendedorCarteira,
        c.ComprouNoMes?'Sim':'Não',c.FatMesAtual.toFixed(2).replace('.',','),c.MediaMensal.toFixed(2).replace('.',','),
        c.UltimaCompra || 'Sem compra 12m',c.DiasUltimaCompra===999?'Sem compra 12m':c.DiasUltimaCompra,c.Celular || c.Telefone].map(csv));

      const conteudoCsv = "\uFEFF" + [cabecalho.join(";"), ...linhas.map(l => l.join(";"))].join("\n");
      const blob = new Blob([conteudoCsv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `radar_carteira_filtrada_${state.competencia}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      state.avisoSupervisor = {
        tipo: "ok",
        texto: `Exportação concluída: ${filtrados.length} cliente(s) exportado(s) respeitando o escopo autorizado e os filtros ativos.`
      };
      renderizarAplicacao();
    }

    function copiarTextoFallback(texto) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).catch(() => {});
      }
      const temp = document.createElement("textarea");
      temp.value = texto;
      temp.style.position = "fixed";
      temp.style.opacity = "0";
      document.body.appendChild(temp);
      temp.select();
      try {
        document.execCommand("copy");
      } catch (_) {}
      document.body.removeChild(temp);
    }

    document.getElementById("mainContent").addEventListener("click", async (e) => {
      const alvo = e.target.closest("[data-action]");
      if (!alvo) return;

      const action = alvo.getAttribute("data-action");
      if (action === 'pdf-pendentes') {
        if(pendingPdf) return;
        const curva=alvo.getAttribute('data-curva');
        pendingPdf=true;
        enviar({tipo:'pdf_pendentes',id:crypto.randomUUID(),curva,vendedores:codigosNoEscopo()});
        renderizarAplicacao(); return;
      }
      if (action === 'pagina-anterior' || action === 'pagina-proxima') {
        state.pagina += action === 'pagina-anterior' ? -1 : 1;
        renderizarAplicacao(); return;
      }
      if (['mudar-aba','mudar-subfiltro-cad','limpar-filtros','filtrar-curva','filtrar-curva-nao-compraram','atalho-curva-a-sem-compra','atalho-abaixo-media','selecionar-vendedora-tabela','mudar-area-sup'].includes(action)) state.pagina=0;
      if(action === 'abrir-wa-real') {
        const cod=alvo.getAttribute('data-cod');
        const c=[...CARTEIRA_CLIENTES,...CADASTROS_MES].find(x=>x.CodCliFor===cod);
        const input=document.getElementById('msg-'+cod);
        if(c && /^55\d{10,11}$/.test(c.Celular)) window.open('https://wa.me/'+c.Celular+'?text='+encodeURIComponent(input?input.value:''),'_blank','noopener,noreferrer');
        return;
      }

      if (action === "restaurar-estado-normal") {
        state.estadoTela = "normal";
        document.getElementById("simularEstadoSelect").value = "normal";
        renderizarAplicacao();
      } else if (action === "mudar-aba") {
        state.abaClientes = alvo.getAttribute("data-aba");
        renderizarAplicacao();
      } else if (action === "mudar-subfiltro-cad") {
        state.subfiltroCadastrados = alvo.getAttribute("data-sub");
        renderizarAplicacao();
      } else if (action === "toggle-filtros-avancados") {
        state.mostrarFiltrosAvancados = !state.mostrarFiltrosAvancados;
        renderizarAplicacao();
      } else if (action === "limpar-filtros") {
        limparTodosFiltros();
        renderizarAplicacao();
      } else if (action === "filtrar-curva") {
        const curva = alvo.getAttribute("data-curva");
        state.filtroCurva = state.filtroCurva === curva ? "TODAS" : curva;
        state.abaClientes = "todos";
        if (state.areaSupervisor === "visao_geral" && !state.visaoAtual.startsWith("vendedora_")) {
          state.areaSupervisor = "carteira_geral";
        }
        renderizarAplicacao();
      } else if (action === "filtrar-curva-nao-compraram") {
        const curva = alvo.getAttribute("data-curva");
        state.filtroCurva = curva;
        state.filtroSituacaoMes = "NAO_COMPROU";
        state.abaClientes = "todos";
        if (state.areaSupervisor === "visao_geral" && !state.visaoAtual.startsWith("vendedora_")) {
          state.areaSupervisor = "carteira_geral";
        }
        renderizarAplicacao();
        const sec = document.getElementById("secaoCarteiraClientes");
        if (sec) sec.scrollIntoView({ behavior: "smooth" });
      } else if (action === "atalho-curva-a-sem-compra") {
        limparTodosFiltros();
        state.filtroCurva = "A";
        state.filtroSituacaoMes = "NAO_COMPROU";
        state.abaClientes = "todos";
        state.areaSupervisor = "carteira_geral";
        renderizarAplicacao();
      } else if (action === "atalho-abaixo-media") {
        limparTodosFiltros();
        state.filtroSituacaoMes = "ABAIXO_MEDIA";
        state.abaClientes = "todos";
        state.areaSupervisor = "carteira_geral";
        renderizarAplicacao();
      } else if (action === "mudar-area-sup") {
        state.areaSupervisor = alvo.getAttribute("data-area");
        state.avisoSupervisor = null;
        renderizarAplicacao();
      } else if (action === "selecionar-vendedora-tabela") {
        const cod = alvo.getAttribute("data-cod");
        state.filtroVendedoraEscopo = cod;
        state.areaSupervisor = "visao_geral";
        renderizarAplicacao();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else if (action === "alternar-modo-carteira-sup") {
        state.modoExibicaoCarteiraSup = state.modoExibicaoCarteiraSup === "tabela" ? "cartoes" : "tabela";
        renderizarAplicacao();
      } else if (action === "ir-para-cartao-cliente") {
        const cod = alvo.getAttribute("data-cod");
        state.termoBusca=cod; state.abaClientes='todos'; state.pagina=0;
        renderizarAplicacao();
        const card = document.getElementById(`card-cli-${cod}`);
        if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
      } else if (action === "exportar-csv-carteira") {
        exportarCarteiraFiltradaCSV();
      } else if (action === "toggle-drawer") {
        const qual = alvo.getAttribute("data-drawer");
        state.gavetaDocAberta = state.gavetaDocAberta === qual ? null : qual;
        renderizarAplicacao();
      } else if (action === "fechar-drawer") {
        state.gavetaDocAberta = null;
        renderizarAplicacao();
      } else if (action === "abrir-whatsapp-demo") {
        const cod = alvo.getAttribute("data-cod");
        state.whatsappAbertoCod = state.whatsappAbertoCod === cod ? null : cod;
        renderizarAplicacao();
      } else if (action === "fechar-whatsapp-demo") {
        state.whatsappAbertoCod = null;
        renderizarAplicacao();
      } else if (action === "copiar-msg-demo") {
        const cod = alvo.getAttribute("data-cod");
        const textarea = document.getElementById(`msg-${cod}`);
        const feedback = document.getElementById(`copy-feedback-${cod}`);
        if (textarea && feedback) {
          try { await navigator.clipboard.writeText(textarea.value); feedback.textContent="Mensagem copiada."; } catch (_) { feedback.textContent="Selecione a mensagem e copie com Ctrl+C."; }
        }
      }
    });

    // Mudanças em selects de filtro e escopo
    document.getElementById("mainContent").addEventListener("change", (e) => {
      const target = e.target;
      if (!target) return;
      state.pagina = 0;
      if (target.id === "mesMeta") {
        state.competenciaMeta = target.value; state.avisoSupervisor = null;
        renderizarAplicacao(); return;
      }

      if (target.id === "selectEquipeGestao") {
        state.filtroEquipeGestao = target.value;
        state.filtroVendedoraEscopo = "TODAS";
        renderizarAplicacao();
        return;
      }

      if (target.id === "selectVendedoraEscopo") {
        state.filtroVendedoraEscopo = target.value;
        renderizarAplicacao();
        return;
      }

      const propFiltro = target.getAttribute("data-filter");
      if (propFiltro && propFiltro in state) {
        state[propFiltro] = target.value;
        renderizarAplicacao();
      }
    });

    // Aguarda uma pausa curta na digitação antes de reconstruir a carteira.
    let buscaTimer;
    // Busca textual em tempo real mantendo o cursor
    document.getElementById("mainContent").addEventListener("input", (e) => {
      if (e.target && e.target.id === "buscaClienteInput") {
        const pos = e.target.selectionStart;
        state.pagina=0;
        state.termoBusca = e.target.value;
        clearTimeout(buscaTimer);
        buscaTimer = setTimeout(() => {
        renderizarAplicacao();
        const novoInput = document.getElementById("buscaClienteInput");
        if (novoInput) {
          novoInput.focus();
          try {
            novoInput.setSelectionRange(pos, pos);
          } catch (_) {}
        }
        }, 220);
      }
    });

    document.getElementById("mainContent").addEventListener("submit", (e) => {
      const form = e.target.closest("form[data-action='salvar-meta-demo']");
      if (!form) return;
      e.preventDefault();
      if (!servidor || pending || state.visaoAtual.startsWith("vendedora_")) return;
      const cod = form.getAttribute("data-cod");
      const valor = form.querySelector("input[name='valorMeta']").value.trim();
      if (!/^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(valor)) {
        state.avisoSupervisor = {tipo:"err",texto:"Use o formato brasileiro: 35000,00 ou 35.000,00."};
        renderizarAplicacao(); return;
      }
      const reg = DESEMPENHO_FINANCEIRO[`1|${cod}|${state.competenciaMeta}`];
      pending = true;
      state.avisoSupervisor = {tipo:"ok",texto:"Salvando meta no servidor…"};
      enviar({tipo:"salvar_meta",id:crypto.randomUUID(),vendedor:cod,
        competencia:state.competenciaMeta,valor,versao:reg ? reg.Versao : 0});
      renderizarAplicacao();
    });

    // Inicializa horário de abertura da página em America/Sao_Paulo (diferenciando da atualização dos dados)
    const horaAbertura = new Date().toLocaleTimeString("pt-BR", {
      timeZone: "America/Sao_Paulo",
      hour: "2-digit",
      minute: "2-digit"
    });
    const elLoad = document.getElementById("pageLoadTimestamp");
    if (elLoad) {
      elLoad.textContent = `Página carregada às ${horaAbertura}`;
    }

    // First render occurs only after authenticated Python data arrive.

    function enviar(value) {
      window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value,dataType:'json'},'*');
    }
    let lastHeight=0;
    function ajustarAltura() {
      const root=document.getElementById('radarRoot');
      const height=Math.max(300,Math.ceil(root.getBoundingClientRect().height));
      if(height!==lastHeight){lastHeight=height;window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height},'*');}
    }
    function formatarCompetenciaLegivel(m) {
      if(!/^\d{4}-\d{2}$/.test(m)) return '';
      return new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(m+'-15T12:00:00Z'));
    }
    function calcularConsolidadoVendedoras(vendedoras, competencia) {
      const key=vendedoras.map(v=>v.CodVendedor).sort().join('|');
      const r=servidor.resumos[key];
      if(!r || competencia!==servidor.competencia) return {somaRealizado:null,somaMeta:null,somaMetaParcial:null,todasTemMeta:false,vendedorasSemMeta:[],rentabilidadeConsolidada:null,percentualMeta:null,larguraBarra:0,falta:null,superou:null};
      return r;
    }
    const listaCartoesOriginal=renderizarListaCartoesClientes;
    renderizarListaCartoesClientes=function(clientes, responsavel){
      const total=clientes.length;
      state.pagina=Math.max(0,Math.min(state.pagina,Math.max(0,Math.ceil(total/25)-1)));
      const ini=state.pagina*25;
      return `<div class="pagination"><button type="button" class="btn-secondary-outline" data-action="pagina-anterior" ${state.pagina===0?'disabled':''}>Anterior</button><span>${total?ini+1:0}–${Math.min(ini+25,total)} de ${total}</span><button type="button" class="btn-secondary-outline" data-action="pagina-proxima" ${ini+25>=total?'disabled':''}>Próxima</button></div>`+listaCartoesOriginal(clientes.slice(ini,ini+25),responsavel);
    };
    const renderOriginal=renderizarAplicacao;
    renderizarAplicacao=function(){
      if(!servidor) return;
      guardarPaineisAbertos();
      renderOriginal();
      document.getElementById('userNameLabel').textContent=servidor.usuario.nome;
      document.getElementById('snapshotTimestamp').textContent=servidor.atualizacaoCarteira;
      const main=document.getElementById('mainContent');
      let header='';
      if(linkPdf) header+=`<div class="server-notice"><a href="${linkPdf.url}" download="${escaparHtml(linkPdf.nome)}">Baixar PDF preparado</a></div>`;
      if(state.avisoSupervisor) header+=`<div class="server-notice" role="status">${escaparHtml(state.avisoSupervisor.texto)}</div>`;
      header+=`<details class="server-info" ${atributosPainel('base-carteira')}><summary>Base da carteira: compras de ${escaparHtml(servidor.periodoCarteiraInicio || '')} a ${escaparHtml(servidor.referenciaCarteira)}</summary><p>Responsável atual do cadastro. Classificação ABC global preservada. Financeiro pelo vendedor da movimentação. Mês em andamento.</p>${servidor.avisos.map(x=>`<p>${escaparHtml(x)}</p>`).join('')}</details>`;
      const f=servidor.financeiroGeral;
      if(f && state.visaoAtual==='gestao_geral' && state.filtroEquipeGestao==='TODAS' && state.filtroVendedoraEscopo==='TODAS') {
        header+=`<section class="abc-section"><h2>Consolidado geral — relatório Cronos</h2><div class="client-metrics"><div class="c-metric"><span>Faturamento</span><strong>${formatarReais(f.receita)}</strong></div><div class="c-metric"><span>Rentabilidade</span><strong>${f.margem===null?'—':f.margem.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'}</strong></div><div class="c-metric"><span>Quantidade — Cronos</span><strong>${f.qtd===null?'—':f.qtd}</strong></div><div class="c-metric"><span>Custo</span><strong>${formatarReais(f.custo)}</strong></div></div><p class="server-info">Inclui todas as linhas do relatório, inclusive EMPRESA e INATIVADOS. As metas abaixo acompanham apenas as vendedoras elegíveis.</p></section>`;
      }
      main.insertAdjacentHTML('afterbegin',header);
      requestAnimationFrame(ajustarAltura);
    };
    // Rendering only accepts data from the parent Streamlit frame.
    window.addEventListener('message', event=>{
      if(event.source!==window.parent || event.data?.type!=='streamlit:render') return;
      const args=event.data.args || {};
      if(!args.payload) return;
      // O Streamlit reenvia os mesmos argumentos ao ajustar a altura do iframe.
      // Nao substitua o DOM nesse caso: isso fecha details e apaga formularios.
      const assinatura=JSON.stringify({payload:args.payload,feedback:args.feedback||null,arquivoPdf:args.arquivoPdf||null});
      if(assinatura===ultimaMensagemRender) {requestAnimationFrame(ajustarAltura);return;}
      ultimaMensagemRender=assinatura;
      const p=args.payload;
      const first=!servidor || servidor.usuario.cod!==p.usuario.cod || servidor.usuario.role!==p.usuario.role;
      if(first) {
        paineisAbertos.clear();
        document.getElementById('mainContent').innerHTML='';
        state.filtroEquipeGestao='TODAS';state.filtroVendedoraEscopo='TODAS';
        state.whatsappAbertoCod=null;state.gavetaDocAberta=null;
      }
      servidor=p;
      VENDEDORAS=p.vendedoras;SUPERVISORES=p.supervisores;CARTEIRA_CLIENTES=p.clientes;CADASTROS_MES=p.cadastrosMes || [];
      DESEMPENHO_FINANCEIRO=p.financeiro;ORCAMENTOS=p.orcamentos;PREVENDAS=p.prevendas;
      DATA_ATUALIZACAO_DADOS=p.atualizacaoFinanceiro;
      state.visaoAtual=p.visao; state.competencia=p.competencia;
      if(state.filtroVendedoraEscopo!=='TODAS' && !VENDEDORAS.some(v=>v.CodVendedor===state.filtroVendedoraEscopo)) state.filtroVendedoraEscopo='TODAS';
      if(state.filtroEquipeGestao!=='TODAS' && !SUPERVISORES.some(s=>s.IdEquipe===state.filtroEquipeGestao)) state.filtroEquipeGestao='TODAS';
      if(first){state.competenciaMeta=p.competencia;state.pagina=0;}
      if(args.feedback){pending=false;pendingPdf=false;state.avisoSupervisor=args.feedback;}
      if(!args.arquivoPdf && linkPdf){URL.revokeObjectURL(linkPdf.url);linkPdf=null;ultimoPdf=null;}
      if(args.arquivoPdf && args.arquivoPdf.id!==ultimoPdf) {
        const pdf=args.arquivoPdf;
        const bytes=Uint8Array.from(atob(pdf.base64),c=>c.charCodeAt(0));
        if(linkPdf) URL.revokeObjectURL(linkPdf.url);
        linkPdf={url:URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),nome:pdf.nome};
        ultimoPdf=pdf.id;pendingPdf=false;
        const a=document.createElement('a');a.href=linkPdf.url;a.download=linkPdf.nome;document.body.appendChild(a);a.click();a.remove();
      }
      const select=document.getElementById('competenciaSelect');
      select.innerHTML=`<option value="${escaparHtml(p.competencia)}">${formatarCompetenciaLegivel(p.competencia)}</option>`;
      if(p.logo && /^data:image\/(png|jpeg);base64,/.test(p.logo)) document.getElementById('logoReal').innerHTML=`<img src="${p.logo}" alt="GM Limpezas" style="width:76px;height:auto">`;
      renderizarAplicacao();
    });
    new ResizeObserver(()=>requestAnimationFrame(ajustarAltura)).observe(document.getElementById('radarRoot'));
    window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
    ajustarAltura();

    function codigosNoEscopo() {
      let vs=VENDEDORAS;
      if(state.visaoAtual.startsWith('vendedora_')) return [state.visaoAtual.slice(10)];
      if(state.visaoAtual.startsWith('supervisor_')) vs=vs.filter(v=>v.IdEquipe===state.visaoAtual.slice(11));
      else if(state.filtroEquipeGestao!=='TODAS') vs=vs.filter(v=>v.IdEquipe===state.filtroEquipeGestao);
      if(state.filtroVendedoraEscopo!=='TODAS') vs=vs.filter(v=>v.CodVendedor===state.filtroVendedoraEscopo);
      return vs.map(v=>v.CodVendedor);
    }
    function cadastrosNoEscopo() {
      const codes=new Set(codigosNoEscopo());
      return CADASTROS_MES.filter(c=>codes.has(c.CodVendedorCarteira));
    }

    function cadastroCompletoNoEscopo() {
      const codigos=codigosNoEscopo();
      const mapa=servidor.cadastroCompletoPorVendedor;
      return mapa ? codigos.length>0 && codigos.every(c=>mapa[c]===true) : Boolean(servidor.cadastroDisponivel);
    }

    function aplicarAba(clientes) {
      if(state.abaClientes==='prioridades') return clientes.filter(ehPrioridade);
      if(state.abaClientes==='retomar') return clientes.filter(ehRetomarContato);
      if(state.abaClientes==='cadastrados_mes') return cadastrosNoEscopo().filter(passaPelosFiltrosPlanilha).filter(c=>ehCadastradoNoMes(c) && (state.subfiltroCadastrados==='todos' || (state.subfiltroCadastrados==='ja_compraram' ? c.ComprouNoMes : !c.ComprouNoMes)));
      return clientes;
    }
    const equipeOriginal=renderizarArea1VisaoGeralEquipe;
    renderizarArea1VisaoGeralEquipe=function(vendedoras,clientes,titulo){
      const codes=new Set(vendedoras.map(v=>v.CodVendedor));
      const orc=ORCAMENTOS.filter(d=>codes.has(d.CodVendedor));
      const prev=PREVENDAS.filter(d=>codes.has(d.CodVendedor));
      return equipeOriginal(vendedoras,clientes,titulo)+`<section class="abc-section"><h2>Documentos em aberto da equipe</h2><p class="server-info">Valores separados do faturamento realizado.</p><div class="filter-tabs"><button type="button" class="tab-btn" data-action="toggle-drawer" data-drawer="orcamentos">Orçamentos (${servidor.documentosDisponiveis.orcamentos?orc.length:'—'})</button><button type="button" class="tab-btn" data-action="toggle-drawer" data-drawer="prevendas">Pré-vendas (${servidor.documentosDisponiveis.prevendas?prev.length:'—'})</button></div>${renderizarGavetaDocumentos(orc,prev)}</section>`;
    };

  </script>
</body>
</html>
