<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Comercial — GM Limpezas </title>
  <style>
    :root {
      --navy: #1B3A5C;
      --navy-dark: #10243B;
      --blue: #2E6BA6;
      --blue-light: #EBF3FA;
      --blue-border: #C4D9EC;
      --green: #16794B;
      --green-bg: #E8F6EF;
      --green-border: #A8DFC4;
      --amber: #9A5B00;
      --amber-bg: #FEF5E7;
      --amber-border: #F5D399;
      --red-soft: #9E2A2B;
      --red-bg: #FDF0F0;
      --red-border: #F2B8B8;
      --purple-abc: #5B4B8A;
      --bg: #F3F6FA;
      --surface: #FFFFFF;
      --surface-alt: #F8FAFC;
      --text: #182635;
      --text-muted: #52657A;
      --border: #D9E2EC;
      --focus: #FF9800;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(27, 58, 92, 0.08);
      --shadow-md: 0 6px 18px rgba(27, 58, 92, 0.11);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input, select, summary, textarea, a {
      font-family: inherit;
      font-size: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--focus) !important;
      outline-offset: 2px !important;
    }

    .demo-banner {
      background: var(--navy-dark);
      color: #FFFFFF;
      padding: 10px 16px;
      border-bottom: 3px solid var(--blue);
      font-size: 0.85rem;
    }

    .demo-banner-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .demo-badge-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .demo-tag {
      background: #FFB74D;
      color: #10243B;
      font-weight: 800;
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .demo-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .demo-control-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .demo-control-item label {
      font-weight: 600;
      color: #D9E2EC;
      font-size: 0.82rem;
    }

    .demo-select {
      min-height: 40px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid #6282A3;
      background: #1B3A5C;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .app-header {
      position: static !important;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 14px 16px;
    }

    .app-header-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(27, 58, 92, 0.18);
    }

    .brand-titles h1 {
      font-size: 1.3rem;
      color: var(--navy);
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .brand-subtitle {
      font-size: 0.84rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .update-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #F1F5F9;
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      color: var(--navy);
      font-size: 0.8rem;
    }

    .header-context {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-pill {
      background: var(--blue-light);
      border: 1px solid var(--blue-border);
      color: var(--navy);
      padding: 7px 14px;
      border-radius: var(--radius-md);
      font-size: 0.86rem;
      display: flex;
      flex-direction: column;
    }

    .user-pill strong {
      font-size: 0.95rem;
      color: var(--navy-dark);
    }

    .competencia-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: var(--radius-md);
    }

    .competencia-box label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .competencia-select {
      min-height: 40px;
      border: none;
      background: transparent;
      font-weight: 700;
      color: var(--navy);
      cursor: pointer;
      padding: 0 4px;
    }

    .main-container {
      max-width: 1240px;
      margin: 20px auto 56px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Barra de Escopo (Supervisor e Gestão) */
    .scope-bar {
      background: var(--surface);
      border: 1px solid var(--blue-border);
      border-left: 5px solid var(--navy);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    .scope-bar-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .scope-bar-title strong {
      color: var(--navy-dark);
      font-size: 1rem;
    }

    .scope-bar-title span {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .scope-selectors {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .scope-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scope-field label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--navy);
    }

    .scope-select {
      min-height: 44px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--navy-dark);
      font-weight: 700;
      cursor: pointer;
    }

    /* Subnavegação das 4 áreas do Supervisor / Gestão */
    .role-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--surface);
      padding: 10px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .role-nav-btn {
      min-height: 44px;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .role-nav-btn:hover {
      background: var(--blue-light);
      color: var(--navy);
    }

    .role-nav-btn.active {
      background: var(--navy);
      color: #FFFFFF;
      box-shadow: var(--shadow-sm);
    }

    /* Cartão Principal de Meta e Indicadores Financeiros */
    .goal-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 4px solid var(--navy);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .goal-hero.status-exceeded {
      border-top-color: var(--green);
    }

    .goal-hero.status-missing {
      border-top-color: var(--amber);
    }

    .goal-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .goal-title-group h2 {
      font-size: 1.15rem;
      color: var(--navy);
      font-weight: 800;
    }

    .goal-title-group p {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .status-pill.in-progress {
      background: var(--blue-light);
      color: var(--navy);
      border: 1px solid var(--blue-border);
    }

    .status-pill.exceeded {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
    }

    .status-pill.missing {
      background: var(--amber-bg);
      color: var(--amber);
      border: 1px solid var(--amber-border);
    }

    .goal-metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-box {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .metric-box.highlight-green {
      background: var(--green-bg);
      border-color: var(--green-border);
    }

    .metric-box.highlight-amber {
      background: var(--amber-bg);
      border-color: var(--amber-border);
    }

    .metric-box.highlight-blue {
      background: var(--blue-light);
      border-color: var(--blue-border);
    }

    .metric-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .metric-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--navy-dark);
      word-break: break-word;
    }

    .metric-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .progress-wrapper {
      margin-top: 8px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--navy);
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .progress-fill.exceeded {
      background: var(--green);
    }

    .goal-footnote {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .abc-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .abc-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .abc-header h2 {
      font-size: 1.12rem;
      color: var(--navy);
      font-weight: 800;
    }

    .abc-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .abc-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: center;
    }

    .abc-donut-card {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .abc-donut-title {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--navy);
      text-align: center;
    }

    .donut-svg-wrap {
      position: relative;
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .donut-segment {
      cursor: pointer;
      transition: opacity 0.15s, stroke-width 0.15s;
    }

    .donut-segment:hover {
      opacity: 0.85;
    }

    .donut-legend {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.83rem;
    }

    .donut-legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      background: #FFFFFF;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .donut-legend-item:hover {
      border-color: var(--blue);
      background: var(--blue-light);
    }

    .donut-legend-item.active-curve {
      border: 2px solid var(--navy);
      background: var(--blue-light);
    }

    .legend-dot-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--navy-dark);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .abc-bars-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .abc-curve-row {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s, background 0.15s;
    }

    .abc-curve-row.active-curve {
      border: 2px solid var(--navy);
      background: var(--blue-light);
    }

    .abc-curve-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .abc-curve-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .curve-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.84rem;
      color: #FFFFFF;
    }

    .curve-badge.curve-A { background: var(--navy); }
    .curve-badge.curve-B { background: var(--blue); }
    .curve-badge.curve-C { background: #64748B; }

    .abc-curve-summary-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--navy-dark);
    }

    .abc-curve-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-curve-filter {
      min-height: 38px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--navy);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-curve-filter:hover {
      border-color: var(--blue);
      background: var(--blue-light);
    }

    .btn-curve-filter.warn {
      color: var(--amber);
      border-color: var(--amber-border);
      background: var(--amber-bg);
    }

    .btn-curve-filter.warn:hover {
      background: #FDEBD0;
    }

    .abc- accessible-details {
      margin-top: 12px;
      border-top: 1px dashed var(--border);
      padding-top: 10px;
      font-size: 0.84rem;
    }

    .abc-accessible-details summary {
      cursor: pointer;
      color: var(--blue);
      font-weight: 700;
      padding: 4px 0;
    }

    .quick-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .summary-card-button {
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
      min-height: 68px;
    }

    .summary-card-button:hover {
      border-color: var(--blue);
      background: var(--blue-light);
    }

    .summary-card-button.active-drawer {
      border: 2px solid var(--navy);
      background: var(--blue-light);
    }

    .summary-info span {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .summary-info strong {
      display: block;
      font-size: 1.3rem;
      color: var(--navy);
      font-weight: 800;
      margin-top: 2px;
    }

    .summary-action-tag {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--blue);
      background: #FFFFFF;
      border: 1px solid var(--blue-border);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }

    .docs-drawer {
      background: var(--surface);
      border: 2px solid var(--navy);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-md);
    }

    .docs-drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .docs-drawer-header h3 {
      color: var(--navy);
      font-size: 1.02rem;
    }

    .btn-close-drawer {
      min-height: 40px;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--navy);
      font-weight: 700;
      cursor: pointer;
    }

    .docs-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .doc-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      background: var(--surface-alt);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .doc-item-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .doc-item-client {
      font-weight: 800;
      color: var(--navy-dark);
      font-size: 0.94rem;
    }

    .doc-item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
      font-size: 0.86rem;
    }

    /* Abas da Carteira e Painel de Filtros Combináveis */
    .clients-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tabs-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      min-height: 44px;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .tab-btn:hover {
      border-color: var(--blue);
    }

    .tab-btn.active {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }

    .tab-count {
      background: rgba(255, 255, 255, 0.22);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
    }

    .tab-btn:not(.active) .tab-count {
      background: #E2E8F0;
      color: var(--navy);
    }

    /* Painel de Filtros Baseados nas Planilhas */
    .filters-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .filters-primary-row {
      display: grid;
      grid-template-columns: 2fr repeat(3, minmax(150px, 1fr)) auto;
      gap: 10px;
      align-items: end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filter-group label {
      font-size: 0.78rem;

<body>
  <div id="radarRoot" style="display:flow-root;width:100%">

  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand-block">
        <div id="logoReal" style="font-size:32px;font-weight:900;color:#1b3a5c">GM</div>
        <div class="brand-titles">
          <h1>Radar Comercial — GM Limpezas</h1>
          <div class="brand-subtitle">
            <span class="update-pill" title="Horário da última extração de dados consolidada (America/Sao_Paulo)">
              🕒 Dados atualizados em: <strong id="snapshotTimestamp">Carregando</strong> (Brasília)
            </span>
            <span id="pageLoadTimestamp" style="font-size:0.78rem;">Página aberta às 14:30</span>
          </div>
        </div>
      </div>

      <div class="header-context">
        <div class="user-pill" id="authenticatedUserBadge">
          <span id="userRoleLabel">Vendedora</span>
          <strong id="userNameLabel">Carregando</strong>
        </div>

        <div class="competencia-box">
          <label for="competenciaSelect">Mês:</label>
          <select disabled title="Dados do mês corrente; outros meses disponíveis na edição de metas" id="competenciaSelect" class="competencia-select" aria-label="Selecionar mês de referência">
            </select>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main-container" id="mainContent">
    <section class="empty-state" aria-live="polite" aria-busy="true"><h3>Carregando informações comerciais...</h3><p>Aguarde enquanto preparamos os indicadores da carteira e das metas do mês.</p><div class="skeleton-box" style="margin-top:12px"></div><div class="skeleton-box"></div></section>
  </main>

  </div>
  <script>
    // Dados recebidos do servidor após autenticação.
    const EMPRESA_ID = 1;
    let DATA_ATUALIZACAO_DADOS = "Carregando";
    let SUPERVISORES = [], VENDEDORAS = [], CARTEIRA_CLIENTES = [];
    let DESEMPENHO_FINANCEIRO = {}, ORCAMENTOS = [], PREVENDAS = [];
    let servidor = null;
    let pending = false;
    let CADASTROS_MES = [];
    let pendingPdf = false;
    let ultimoPdf = null;
    let linkPdf = null;
    const paineisAbertos = new Set();
    let ultimaMensagemRender = null;

    function atributosPainel(chave) {
      return `data-panel="${escaparHtml(chave)}"${paineisAbertos.has(chave) ? ' open' : ''}`;
    }

    function guardarPaineisAbertos() {
      document.getElementById('mainContent').querySelectorAll('details[data-panel]').forEach(painel => {
        const chave=painel.getAttribute('data-panel');
        if(painel.open) paineisAbertos.add(chave);
        else paineisAbertos.delete(chave);
      });
    }
    const state = {
      visaoAtual: "",
      estadoTela: "normal",          // 'normal' | 'sem_data_cadastro' | 'loading' | 'empty' | 'error'
      competencia: "", competenciaMeta: "", pagina: 0,

      // Navegação do Supervisor / Gestão
      areaSupervisor: "visao_geral", // 'visao_geral' | 'desempenho' | 'carteira_geral' | 'metas'
      filtroEquipeGestao: "TODAS",   // 'TODAS' | 'EQ1' | 'EQ2'
      filtroVendedoraEscopo: "TODAS",// 'TODAS' ou CodVendedor ('0101', etc.)
      modoExibicaoCarteiraSup: "tabela", // 'tabela' | 'cartoes'

      // Navegação de Abas da Carteira
      abaClientes: "prioridades",    // 'prioridades' | 'retomar' | 'cadastrados_mes' | 'todos'
      subfiltroCadastrados: "todos", // 'todos' | 'ja_compraram' | 'sem_primeira_compra'

      // Filtros Combináveis baseados nas planilhas
      mostrarFiltrosAvancados: false,
      termoBusca: "",
      filtroCurva: "TODAS",          // 'TODAS' | 'A' | 'B' | 'C'
      filtroSituacaoMes: "TODAS",    // 'TODAS' | 'NAO_COMPROU' | 'ABAIXO_MEDIA' | 'QUEDA_20' | 'NA_MEDIA' | 'ACIMA_MEDIA'
      filtroAtividade2M: "TODOS",    // 'TODOS' | 'ATIVO_2M' | 'INATIVO_2M'
      filtroPeriodoUltCompra: "TODOS",// 'TODOS' | 'MES_ATUAL' | 'MES_PASSADO' | '2_A_4_MESES' | 'MAIS_4_MESES' | 'SEM_12M'
      filtroDiasSemComprar: "TODOS", // 'TODOS' | 'ATE_30' | '31_60' | '61_120' | 'MAIS_120' | 'SEM_12M'
      filtroFaixaMedia: "TODAS",     // 'TODAS' | 'ATE_1500' | '1500_3500' | 'ACIMA_3500'
      filtroFaixaUltCompra: "TODAS", // 'TODAS' | 'ATE_1500' | '1500_3500' | 'ACIMA_3500'
      filtroDiferencaMedia: "TODAS", // 'TODAS' | 'MAIS_2000_ABAIXO' | 'ATE_2000_ABAIXO' | 'IGUAL_OU_ACIMA'
      ordenacao: "PRIORIDADE",       // 'PRIORIDADE' | 'MAIOR_MEDIA' | 'MAIOR_TEMPO_SEM_COMPRAR' | 'MAIOR_DIF_ABAIXO_MEDIA'

      // Interações locais
      gavetaDocAberta: null,         // null | 'orcamentos' | 'prevendas'
      whatsappAbertoCod: null,
      avisoSupervisor: null
    };

    const formatadorMoeda = new Intl.NumberFormat("pt-BR", {
      style: "currency",
      currency: "BRL",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    function formatarReais(valor) {
      if (valor === null || valor === undefined || Number.isNaN(valor)) {
        return "Indisponível";
      }
      return formatadorMoeda.format(valor);
    }

    function formatarPercentual(valor) {
      if (valor === null || valor === undefined || Number.isNaN(valor)) {
        return "—";
      }
      return valor.toLocaleString("pt-BR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + "%";
    }

    function normalizarTextoBusca(str) {
      return String(str || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function escaparHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatarCompetenciaLegivel(comp) {
      const mapa = {
        "2026-10": "Outubro / 2026",
        "2026-11": "Novembro / 2026"
      };
      return mapa[comp] || comp;
    }

    function calcularEstadoMeta(registro) {
      const realizado = registro ? registro.RealizadoMeta : null;
      const meta = registro ? registro.MetaValor : null;
      const rentabilidade = registro ? registro.RentabilidadePct : null;
      const realizadoDisponivel = typeof realizado === "number" && !Number.isNaN(realizado);
      const temMetaValida = typeof meta === "number" && meta > 0;

      if (!temMetaValida) {
        return {
          temMeta: false,
          realizadoDisponivel,
          realizado,
          meta: null,
          rentabilidade,
          percentualReal: null,
          larguraBarra: 0,
          falta: null,
          superou: null,
          statusClasse: "missing",
          statusTexto: "Meta não definida"
        };
      }

      if (!realizadoDisponivel) {
        return {
          temMeta: true,
          realizadoDisponivel: false,
          realizado: null,
          meta,
          rentabilidade,
          percentualReal: null,
          larguraBarra: 0,
          falta: null,
          superou: null,
          statusClasse: "in-progress",
          statusTexto: "Realizado indisponível"
        };
      }

      const percentualReal = (realizado / meta) * 100;
      const larguraBarra = Math.max(0, Math.min(100, percentualReal));
      const falta = Math.max(meta - realizado, 0);
      const superou = realizado > meta ? (realizado - meta) : 0;
      const atingiuOuSuperou = realizado >= meta;

      return {
        temMeta: true,
        realizadoDisponivel: true,
        realizado,
        meta,
        rentabilidade,
        percentualReal,
        larguraBarra,
        falta,
        superou,
        statusClasse: atingiuOuSuperou ? "exceeded" : "in-progress",
        statusTexto: superou > 0
          ? "Meta ultrapassada!"
          : (atingiuOuSuperou ? "Meta atingida!" : "Meta em andamento")
      };
    }

    /*
     * Cálculo consolidado para uma lista de vendedoras (Supervisor ou Gestão):
     * - Rentabilidade consolidada = (SomaReceita - SomaCusto) / SomaReceita * 100
     * - Progresso da meta da equipe = SomaRealizado / SomaMeta (somente quando TODAS têm meta definida)
     */
    function calcularConsolidadoVendedoras(listaVendedoras, competencia) {
      let somaRealizado = 0;
      let somaCusto = 0;
      let somaMeta = 0;
      const vendedorasSemMeta = [];

      listaVendedoras.forEach(v => {
        const reg = DESEMPENHO_FINANCEIRO[`${EMPRESA_ID}|${v.CodVendedor}|${competencia}`];
        if (reg && typeof reg.RealizadoMeta === "number") {
          somaRealizado += reg.RealizadoMeta;
          somaCusto += (reg.CustoValido || 0);
        }
        if (reg && typeof reg.MetaValor === "number" && reg.MetaValor > 0) {
          somaMeta += reg.MetaValor;
        } else {
          vendedorasSemMeta.push(v);
        }
      });

      const todasTemMeta = listaVendedoras.length > 0 && vendedorasSemMeta.length === 0;
      const rentabilidadeConsolidada = somaRealizado > 0
        ? ((somaRealizado - somaCusto) / somaRealizado) * 100
        : null;

      const percentualMeta = (todasTemMeta && somaMeta > 0)
        ? (somaRealizado / somaMeta) * 100
        : null;

      const larguraBarra = percentualMeta !== null
        ? Math.max(0, Math.min(100, percentualMeta))
        : 0;

      const falta = todasTemMeta ? Math.max(somaMeta - somaRealizado, 0) : null;
      const superou = (todasTemMeta && somaRealizado > somaMeta) ? (somaRealizado - somaMeta) : 0;

      return {
        somaRealizado,
        somaMeta: todasTemMeta ? somaMeta : null,
        somaMetaParcial: somaMeta,
        todasTemMeta,
        vendedorasSemMeta,
        rentabilidadeConsolidada,
        percentualMeta,
        larguraBarra,
        falta,
        superou
      };
    }

    /*
     * Cálculo de Progresso por Curva ABC (sempre sobre a carteira selecionada antes dos filtros de busca/situação)
     */
    function calcularProgressoCurvaABC(clientesCarteira) {
      const totalCarteira = clientesCarteira.length;
      const curvas = ["A", "B", "C"];
      const resultado = {};

      curvas.forEach(c => {
        const daCurva = clientesCarteira.filter(cli => cli.CurvaABC === c);
        const total = daCurva.length;
        const compraram = daCurva.filter(cli => cli.ComprouNoMes === true).length;
        const naoCompraram = total - compraram;
        const pctCompradores = total > 0 ? (compraram / total) * 100 : null;
        const pctParticipacaoCarteira = totalCarteira > 0 ? (total / totalCarteira) * 100 : 0;

        resultado[c] = {
          curva: c,
          total,
          compraram,
          naoCompraram,
          pctCompradores,
          pctParticipacaoCarteira
        };
      });

      return {
        totalCarteira,
        A: resultado.A,
        B: resultado.B,
        C: resultado.C
      };
    }

    const ORDEM_STATUS = {
      CRITICO: 1,
      ATENCAO: 2,
      NOVO: 3,
      ATIVO: 4,
      PERDIDO: 5
    };

    function obterDiferencaMedia(cliente) {
      const fat = cliente.FatMesAtual || 0;
      const media = cliente.MediaMensal || 0;
      return fat - media; // Negativo = abaixo da média
    }

    function ehPrioridade(cliente) {
      if (cliente.Status === "CRITICO" || cliente.Status === "ATENCAO" || cliente.Status === "NOVO") {
        return true;
      }
      if (cliente.ComprouNoMes && (cliente.FatMesAtual < cliente.MediaMensal || cliente.AbaixoMedia)) {
        return true;
      }
      if (cliente.CadastradoNoMes && !cliente.ComprouNoMes) {
        return true;
      }
      return false;
    }

    function ehRetomarContato(cliente) {
      return cliente.Status === "PERDIDO" || cliente.DiasUltimaCompra >= 120;
    }

    function ehCadastradoNoMes(cliente) {
      return cliente.CadastradoNoMes === true;
    }

    function classificarSituacaoMesCliente(cliente) {
      if (!cliente.ComprouNoMes) return "NAO_COMPROU";
      const media = cliente.MediaMensal || 0;
      const fat = cliente.FatMesAtual || 0;
      if (media <= 0) return "SEM_MEDIA";
      if (Math.round(fat*100) < Math.round(media*100)) return "ABAIXO_MEDIA";
      if (Math.round(fat*100) === Math.round(media*100)) return "NA_MEDIA";
      return "ACIMA_MEDIA";
    }

    function passaPelosFiltrosPlanilha(cliente) {
      // 1. Busca por nome ou código
      const termo = normalizarTextoBusca(state.termoBusca.trim());
      if (termo) {
        const matchNome = normalizarTextoBusca(cliente.Cliente).includes(termo);
        const matchRazao = normalizarTextoBusca(cliente.RazaoSocial).includes(termo);
        const matchCod = normalizarTextoBusca(cliente.CodCliFor).includes(termo);
        if (!matchNome && !matchRazao && !matchCod) return false;
      }

      // 2. Curva ABC
      if (state.filtroCurva !== "TODAS" && cliente.CurvaABC !== state.filtroCurva) {
        return false;
      }

      // 3. Situação no mês
      if (state.filtroSituacaoMes !== "TODAS") {
        if (state.filtroSituacaoMes === "QUEDA_20") {
          if (!(cliente.ComprouNoMes && cliente.AbaixoMedia === true)) return false;
        } else {
          const sit = classificarSituacaoMesCliente(cliente);
          if (sit !== state.filtroSituacaoMes) return false;
        }
      }

      // 4. Atividade nos últimos 2 meses (diferente de corte fixo de 60 dias)
      if (state.filtroAtividade2M === "ATIVO_2M" && !cliente.AtivoUltimos2Meses) return false;
      if (state.filtroAtividade2M === "INATIVO_2M" && cliente.AtivoUltimos2Meses) return false;

      if (state.filtroPeriodoUltCompra !== "TODOS") {
        const m=cliente.MesesUltimaCompra;
        if (state.filtroPeriodoUltCompra === "SEM_12M" && m !== null) return false;
        if (state.filtroPeriodoUltCompra === "MES_ATUAL" && m !== 0) return false;
        if (state.filtroPeriodoUltCompra === "MES_PASSADO" && m !== 1) return false;
        if (state.filtroPeriodoUltCompra === "2_A_4_MESES" && !(m>=2 && m<=4)) return false;
        if (state.filtroPeriodoUltCompra === "MAIS_4_MESES" && !(m!==null && m>4)) return false;
      }

      // 6. Dias sem comprar
      if (state.filtroDiasSemComprar !== "TODOS") {
        const d = cliente.DiasUltimaCompra;
        if (state.filtroDiasSemComprar === "SEM_12M" && d !== 999) return false;
        if (state.filtroDiasSemComprar === "ATE_30" && d > 30) return false;
        if (state.filtroDiasSemComprar === "31_60" && (d <= 30 || d > 60)) return false;
        if (state.filtroDiasSemComprar === "61_120" && (d <= 60 || d > 120)) return false;
        if (state.filtroDiasSemComprar === "MAIS_120" && (d <= 120 || d === 999)) return false;
      }

      // 7. Faixa de média mensal
      if (state.filtroFaixaMedia !== "TODAS") {
        const m = cliente.MediaMensal || 0;
        if (state.filtroFaixaMedia === "ATE_1500" && m > 1500) return false;
        if (state.filtroFaixaMedia === "1500_3500" && (m <= 1500 || m > 3500)) return false;
        if (state.filtroFaixaMedia === "ACIMA_3500" && m <= 3500) return false;
      }

      // 8. Faixa de valor da última compra
      if (state.filtroFaixaUltCompra !== "TODAS") {
        const v = cliente.ValorUltimaCompra;
        if (v === null || v === undefined) return false;
        if (state.filtroFaixaUltCompra === "ATE_1500" && v > 1500) return false;
        if (state.filtroFaixaUltCompra === "1500_3500" && (v <= 1500 || v > 3500)) return false;
        if (state.filtroFaixaUltCompra === "ACIMA_3500" && v <= 3500) return false;
      }

      // 9. Diferença em reais em relação à média
      if (state.filtroDiferencaMedia !== "TODAS") {
        const dif = obterDiferencaMedia(cliente); // FatMesAtual - MediaMensal
        if (state.filtroDiferencaMedia === "MAIS_2000_ABAIXO" && dif >= -2000) return false;
        if (state.filtroDiferencaMedia === "ATE_2000_ABAIXO" && (dif < -2000 || dif >= 0)) return false;
        if (state.filtroDiferencaMedia === "IGUAL_OU_ACIMA" && dif < 0) return false;
      }

      return true;
    }

    function ordenarListaClientes(clientes) {
      const copia = [...clientes];
      if (state.ordenacao === "MAIOR_MEDIA") {
        return copia.sort((a, b) => (b.MediaMensal || 0) - (a.MediaMensal || 0));
      }
      if (state.ordenacao === "MAIOR_TEMPO_SEM_COMPRAR") {
        return copia.sort((a, b) => (b.DiasUltimaCompra || 0) - (a.DiasUltimaCompra || 0));
      }
      if (state.ordenacao === "MAIOR_DIF_ABAIXO_MEDIA") {
        // Mais negativo primeiro (maior diferença abaixo da média)
        return copia.sort((a, b) => obterDiferencaMedia(a) - obterDiferencaMedia(b));
      }
      // Padrão: Prioridade comercial + Receita em risco
      return copia.sort((a, b) => {
        const pA = ORDEM_STATUS[a.Status] ?? 99;
        const pB = ORDEM_STATUS[b.Status] ?? 99;
        if (pA !== pB) return pA - pB;
        return (b.ReceitaEmRisco || 0) - (a.ReceitaEmRisco || 0);
      });
    }

    function obterAvisosExplicativosCliente(cliente) {
      const avisos = [];

      if (cliente.Status === "CRITICO") {
        avisos.push({
          classe: "critico",
          texto: `Prioridade alta • ${cliente.DiasUltimaCompra} dias sem comprar`
        });
      }

      if (!cliente.ComprouNoMes && cliente.Status !== "CRITICO" && cliente.Status !== "PERDIDO") {
        avisos.push({
          classe: "atencao",
          texto: `Curva ${cliente.CurvaABC} • Ainda não comprou neste mês`
        });
      } else if (!cliente.ComprouNoMes && cliente.CurvaABC === "A") {
        avisos.push({
          classe: "atencao",
          texto: `Curva A • Ainda não comprou neste mês`
        });
      }

      if (cliente.ComprouNoMes && cliente.FatMesAtual < cliente.MediaMensal) {
        avisos.push({
          classe: "atencao",
          texto: "Compra do mês abaixo da média"
        });
      }

      if (cliente.ComprouNoMes && cliente.AbaixoMedia) {
        avisos.push({
          classe: "critico",
          texto: "Alerta: queda superior a 20% em relação à média"
        });
      }

      if (cliente.CadastradoNoMes) {
        if (!cliente.ComprouNoMes) {
          avisos.push({
            classe: "novo",
            texto: "Cadastrado neste mês • Sem primeira compra"
          });
        } else {
          avisos.push({
            classe: "novo",
            texto: "Cadastrado neste mês • 1ª compra realizada"
          });
        }
      }

      if (cliente.Status === "PERDIDO") {
        if (cliente.DiasUltimaCompra === 999 || !cliente.UltimaCompra) {
          avisos.push({
            classe: "retomar",
            texto: "Retomar contato • Sem compra nos 12 meses analisados"
          });
        } else {
          avisos.push({
            classe: "retomar",
            texto: `Retomar contato • ${cliente.DiasUltimaCompra} dias sem comprar`
          });
        }
      }

      if (avisos.length === 0) {
        avisos.push({
          classe: "ativo",
          texto: "Compra no mês igual ou acima da média"
        });
      }

      return avisos;
    }

    function formatarUltimaCompraTexto(cliente) {
      if (cliente.DiasUltimaCompra === 999 || !cliente.UltimaCompra) {
        return "Sem compra nos 12 meses analisados";
      }
      const valorTxt = cliente.ValorUltimaCompra ? ` • Valor: ${formatarReais(cliente.ValorUltimaCompra)}` : "";
      return `${cliente.UltimaCompra} (${cliente.DiasUltimaCompra} dias atrás)${valorTxt}`;
    }

    function formatarDiferencaMediaTexto(cliente) {
      const media = cliente.MediaMensal || 0;
      const fat = cliente.FatMesAtual || 0;
      const dif = fat - media;

      if (media === 0 && fat === 0) {
        return { valor: "R$ 0,00", sub: "Sem média histórica de 12 meses" };
      }
      if (dif < 0) {
        return {
          valor: `-${formatarReais(Math.abs(dif))}`,
          sub: `${formatarReais(Math.abs(dif))} abaixo da média (mês em andamento)`
        };
      }
      if (dif > 0) {
        return {
          valor: `+${formatarReais(dif)}`,
          sub: `${formatarReais(dif)} acima da média histórica`
        };
      }
      return { valor: "R$ 0,00", sub: "Exatamente na média mensal" };
    }

    function gerarMensagemSugerida(cliente, nomeVendedora) {
      const primeiroNomeVend = (nomeVendedora || "Consultora").split(" ")[0];
      if (cliente.CadastradoNoMes && !cliente.ComprouNoMes) {
        return `Olá! Aqui é a ${primeiroNomeVend}, da GM Limpezas. Seja muito bem-vindo(a)! Vi que concluímos seu cadastro neste mês e quero ajudar a montar seu primeiro pedido com os produtos de que você precisa.`;
      }
      if (cliente.Status === "NOVO" || (cliente.CadastradoNoMes && cliente.ComprouNoMes)) {
        return `Olá! Aqui é a ${primeiroNomeVend}, da GM Limpezas. Tudo bem? Passando para acompanhar como foi a entrega do seu primeiro pedido e se precisam de algum apoio!`;
      }
      if (cliente.ComprouNoMes && cliente.FatMesAtual < cliente.MediaMensal) {
        return `Olá! Aqui é a ${primeiroNomeVend}, da GM Limpezas. Tudo bem? Vi que já atendemos vocês neste mês e passei para conferir se precisam repor mais algum item da linha de higiene e limpeza.`;
      }
      return `Olá! Aqui é a ${primeiroNomeVend}, da GM Limpezas. Tudo bem? Estou organizando as entregas da semana e gostaria de verificar como está o estoque de vocês para programarmos a próxima reposição.`;
    }

    function renderizarSecaoProgressoCurvaABC(clientesCarteiraEscopo, tituloContexto) {
      const abc = calcularProgressoCurvaABC(clientesCarteiraEscopo);
      const total = abc.totalCarteira;

      return `
        <section class="abc-section" aria-label="Progresso da carteira por curva">
          <div class="abc-header">
            <div>
              <h2>Progresso da carteira por curva</h2>
              <p>Clientes com compra nos 12 meses do período salvo • ${escaparHtml(tituloContexto)}. Veja quantos já compraram neste mês.</p>
            </div>
            <button type="button" class="btn-secondary-outline" data-action="pdf-pendentes" data-curva="TODAS" ${pendingPdf ? 'disabled' : ''}>${pendingPdf ? 'Preparando PDF…' : 'Baixar pendências em PDF'}</button>
            ${state.filtroCurva !== "TODAS" || state.filtroSituacaoMes !== "TODAS" ? `
              <button type="button" class="btn-secondary-outline" data-action="limpar-filtros">
                Limpar seleção de curva (${escaparHtml(state.filtroCurva)}) ✕
              </button>
            ` : ""}
          </div>

          <div class="abc-layout" style="grid-template-columns:1fr">
            <!-- Barras de Progresso de Compras por Curva -->
            <div class="abc-bars-list">
              ${["A", "B", "C"].map(letra => {
                const d = abc[letra];
                const ativa = state.filtroCurva === letra;

                if (d.total === 0) {
                  return `
                    <div class="abc-curve-row">
                      <div class="abc-curve-top">
                        <div class="abc-curve-title-group">
                          <span class="curve-badge curve-${letra}">Curva ${letra}</span>
                          <span class="abc-curve-summary-text" style="color:var(--text-muted);">
                            Curva ${letra}: Sem clientes nesta carteira
                          </span>
                        </div>
                      </div>
                      <div class="progress-track">
                        <div class="progress-fill" style="width: 0%;"></div>
                      </div>
                    </div>
                  `;
                }

                const largura = Math.max(0, Math.min(100, d.pctCompradores || 0));
                return `
                  <div class="abc-curve-row ${ativa ? "active-curve" : ""}">
                    <div class="abc-curve-top">
                      <div class="abc-curve-title-group">
                        <span class="curve-badge curve-${letra}">Curva ${letra}</span>
                        <span class="abc-curve-summary-text">
                          Curva ${letra}: ${d.compraram} de ${d.total} clientes compraram • ${formatarPercentual(d.pctCompradores)} • ${d.naoCompraram} ainda não compraram
                        </span>
                      </div>

                      <div class="abc-curve-actions">
                        <button
                          type="button"
                          class="btn-curve-filter"
                          data-action="filtrar-curva"
                          data-curva="${letra}"
                        >
                          Ver Curva ${letra} (${d.total})
                        </button>
                        ${d.naoCompraram > 0 ? `
                          <button
                            type="button"
                            class="btn-curve-filter warn"
                            data-action="filtrar-curva-nao-compraram"
                            data-curva="${letra}"
                          >
                            Ainda não compraram (${d.naoCompraram})
                          </button>
                          <button type="button" class="btn-curve-filter" data-action="pdf-pendentes" data-curva="${letra}" ${pendingPdf ? 'disabled' : ''}>Baixar PDF · Curva ${letra}</button>
                        ` : ""}
                      </div>
                    </div>

                    <div class="progress-track" role="progressbar" aria-valuenow="${Math.round(d.pctCompradores)}" aria-valuemin="0" aria-valuemax="100">
                      <div class="progress-fill ${d.pctCompradores >= 100 ? "exceeded" : ""}" style="width: ${largura}%;"></div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <details class="abc-accessible-details" ${atributosPainel('progresso-abc')}>
            <summary>Ver tabela textual acessível do progresso por Curva ABC</summary>
            <div style="margin-top:8px; overflow-x:auto;">
              <table class="history-table" aria-label="Tabela textual de composição e progresso por curva ABC">
                <thead>
                  <tr>
                    <th>Curva (Classificação Global 20/30/50)</th>
                    <th>Clientes na Carteira</th>
                    <th>Participação na Carteira</th>
                    <th>Compraram no Mês</th>
                    <th>Ainda Não Compraram</th>
                    <th>Progresso de Compradores</th>
                  </tr>
                </thead>
                <tbody>
                  ${["A", "B", "C"].map(l => {
                    const d = abc[l];
                    return `
                      <tr>
                        <td><strong>Curva ${l}</strong></td>
                        <td>${d.total > 0 ? d.total : "Sem clientes"}</td>
                        <td>${d.total > 0 ? formatarPercentual(d.pctParticipacaoCarteira) : "—"}</td>
                        <td>${d.total > 0 ? d.compraram : "—"}</td>
                        <td>${d.total > 0 ? d.naoCompraram : "—"}</td>
                        <td><strong>${d.total > 0 ? formatarPercentual(d.pctCompradores) : "Sem clientes"}</strong></td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </details>
        </section>
      `;
    }

    function renderizarEstadosEspeciais() {
      if (state.estadoTela === "loading") {
        return `
          <section class="empty-state" aria-live="polite">
            <h3>Carregando informações comerciais...</h3>
            <p>Aguarde enquanto preparamos os indicadores da carteira e das metas do mês.</p>
            <div class="skeleton-box" style="margin-top:12px;"></div>
            <div class="skeleton-box"></div>
          </section>
        `;
      }
      if (state.estadoTela === "error") {
        return `
          <section class="empty-state" style="border-color:var(--red-border); background:var(--red-bg); color:var(--red-soft);" role="alert">
            <h3 style="color:var(--red-soft);">Não foi possível carregar a atualização mais recente</h3>
            <p>Ocorreu uma indisponibilidade temporária na leitura dos arquivos de dados. Nenhum valor foi zerado ou substituído.</p>
            <button type="button" class="btn-primary-navy" data-action="restaurar-estado-normal">
              Tentar novamente (Voltar à operação normal)
            </button>
          </section>
        `;
      }
      if (state.estadoTela === "empty") {
        return `
          <section class="empty-state">
            <h3>Nenhum cliente vinculado a este recorte no momento</h3>
            <p>Não encontramos clientes ativos para a seleção atual na competência ${formatarCompetenciaLegivel(state.competencia)}.</p>
            <button type="button" class="btn-secondary-outline" data-action="restaurar-estado-normal">
              Voltar à carteira
            </button>
          </section>
        `;
      }
      return null;
    }

    function renderizarAplicacao() {
      const main = document.getElementById("mainContent");
      const userRoleLabel = document.getElementById("userRoleLabel");
      const userNameLabel = document.getElementById("userNameLabel");

      // Atualiza rótulo do perfil no cabeçalho
      if (state.visaoAtual.startsWith("vendedora_")) {
        const cod = state.visaoAtual.replace("vendedora_", "");
        const vend = VENDEDORAS.find(v => v.CodVendedor === cod) || VENDEDORAS[0];
        userRoleLabel.textContent = "Perfil: Vendedora";
        userNameLabel.textContent = `${vend.Nome} (Cód. ${vend.CodVendedor})`;
      } else if (state.visaoAtual.startsWith("supervisor_")) {
        const idEq = state.visaoAtual.replace("supervisor_", "");
        const sup = SUPERVISORES.find(s => s.IdEquipe === idEq) || SUPERVISORES[0];
        userRoleLabel.textContent = "Perfil: Supervisor";
        userNameLabel.textContent = `${sup.Nome}`;
      } else {
        userRoleLabel.textContent = "Perfil: Gestão";
        userNameLabel.textContent = "Diretoria / Gestão Comercial";
      }

      // Verifica se há simulação de estado de carregamento/erro/vazio
      const htmlEstadoEspecial = renderizarEstadosEspeciais();
      if (htmlEstadoEspecial) {
        main.innerHTML = htmlEstadoEspecial;
        return;
      }

      if (state.visaoAtual.startsWith("vendedora_")) {
        const cod = state.visaoAtual.replace("vendedora_", "");
        const vend = VENDEDORAS.find(v => v.CodVendedor === cod) || VENDEDORAS[0];

        main.innerHTML = renderizarVisaoSupervisaoOuGestao("supervisor", sup);

      }

    function obterChipsFiltrosAtivos() {
      const chips = [];
      if (state.termoBusca.trim()) chips.push(`Busca: "${state.termoBusca.trim()}"`);
      if (state.filtroCurva !== "TODAS") chips.push(`Curva ${state.filtroCurva}`);
      if (state.filtroSituacaoMes !== "TODAS") {
        const mapaSit = {
          NAO_COMPROU: "Ainda não comprou no mês",
          ABAIXO_MEDIA: "Comprou abaixo da média",
          QUEDA_20: "Alerta: queda > 20%",
          NA_MEDIA: "Na faixa da média",
          ACIMA_MEDIA: "Acima da média"
        };
        chips.push(mapaSit[state.filtroSituacaoMes] || state.filtroSituacaoMes);
      }
      if (state.filtroAtividade2M !== "TODOS") {
        chips.push(state.filtroAtividade2M === "ATIVO_2M" ? "Ativo nos últimos 2 meses" : "Sem compra nos últimos 2 meses");
      }
      if (state.filtroPeriodoUltCompra !== "TODOS") chips.push(`Período últ. compra: ${state.filtroPeriodoUltCompra}`);
      if (state.filtroDiasSemComprar !== "TODOS") chips.push(`Dias sem comprar: ${state.filtroDiasSemComprar}`);
      if (state.filtroFaixaMedia !== "TODAS") chips.push(`Faixa média: ${state.filtroFaixaMedia}`);
      if (state.filtroFaixaUltCompra !== "TODAS") chips.push(`Valor últ. compra: ${state.filtroFaixaUltCompra}`);
      if (state.filtroDiferencaMedia !== "TODAS") chips.push(`Diferença média: ${state.filtroDiferencaMedia}`);
      return chips;
    }

    function renderizarCadastrosForaCarteira() {
      if (state.visaoAtual !== 'gestao_geral' || state.filtroEquipeGestao !== 'TODAS' || state.filtroVendedoraEscopo !== 'TODAS') return '';
      const registros = servidor.cadastrosSemCarteiraAtiva || [];
      const busca = normalizarTextoBusca(state.termoBusca).trim();
      const visiveis = registros.filter(c => normalizarTextoBusca(`${c.Cliente} ${c.RazaoSocial} ${c.CodCliFor}`).includes(busca));
      return `<section class="filters-panel" style="margin-top:16px;">
        <h3>Novos cadastros fora das carteiras ativas (${registros.length})</h3>
        <p class="server-info">Confira o responsável no Cronos para encaminhar estes clientes à equipe. A situação de compra não é apurada neste grupo.</p>
        ${servidor.cadastrosForaCarteiraCompletos ? '' : '<p class="server-info">Existem cadastros sem data informada; esta lista pode estar incompleta.</p>'}
        ${visiveis.length ? `<div class="table-container"><table class="data-table" aria-label="Novos cadastros fora das carteiras ativas"><thead><tr><th>Cliente / Código</th><th>Razão social</th><th>Cadastro</th><th>Responsável cadastrado</th><th>Situação</th></tr></thead><tbody>
          ${visiveis.map(c => `<tr><td><strong>${escaparHtml(c.Cliente)}</strong><br>${escaparHtml(c.CodCliFor)}</td><td>${escaparHtml(c.RazaoSocial || '—')}</td><td>${escaparHtml(c.DataCadastro)}</td><td>${escaparHtml(c.VendedorCarteira || c.CodVendedorCarteira || 'Sem responsável')}</td><td>${escaparHtml(c.SituacaoResponsavel)}</td></tr>`).join('')}
        </tbody></table></div>` : '<p class="server-info">Nenhum registro com data conhecida neste recorte.</p>'}
      </section>`;
    }

    function renderizarAbaCadastradosNoMes(clientesVisiveis, todosCadastradosNoRecorte) {
      if (!servidor.cadastroListagemDisponivel) return '<div class="empty-state"><h3>Data de cadastro indisponível</h3><p>Atualize a base com o campo de cadastro configurado para consultar esta aba.</p></div>';
      const qtdTodos = todosCadastradosNoRecorte.length;
      const qtdJaCompraram = todosCadastradosNoRecorte.filter(c => c.ComprouNoMes).length;
      const qtdSemPrimeira = qtdTodos - qtdJaCompraram;
      const simularSemDataCadastro = state.estadoTela === "sem_data_cadastro";

      return `
        <div class="filters-panel" style="background:var(--surface-alt);">
          <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px;">
            <div>
              <h3 style="color:var(--navy); font-size:1.02rem;">Acompanhamento de Clientes Cadastrados no Mês</h3>
              <p style="font-size:0.84rem; color:var(--text-muted);">
                Cadastros do mês até ${escaparHtml(servidor.referenciaCarteira)}, conforme a data de operação do cadastro no Cronos.
              </p>
            </div>
            <div class="filter-tabs">
              <button type="button" class="tab-btn ${state.subfiltroCadastrados === "todos" ? "active" : ""}" data-action="mudar-subfiltro-cad" data-sub="todos">
                ${cadastroCompletoNoEscopo() ? 'Todos' : 'Com data informada'} <span class="tab-count">${qtdTodos}</span>
              </button>
              <button type="button" class="tab-btn ${state.subfiltroCadastrados === "ja_compraram" ? "active" : ""}" data-action="mudar-subfiltro-cad" data-sub="ja_compraram">
                Já compraram <span class="tab-count">${qtdJaCompraram}</span>
              </button>
              <button type="button" class="tab-btn ${state.subfiltroCadastrados === "sem_primeira_compra" ? "active" : ""}" data-action="mudar-subfiltro-cad" data-sub="sem_primeira_compra">
                Sem compra no período <span class="tab-count">${qtdSemPrimeira}</span>
              </button>
            </div>
          </div>

          ${cadastroCompletoNoEscopo() ? '' : '<p class="server-info">Lista parcial: há clientes sem data de cadastro. Os totais gerais ficam indisponíveis.</p>'}
        </div>

        ${clientesVisiveis.length === 0 ? `
          <div class="empty-state">
            <h3>Nenhum cliente cadastrado no mês para este filtro</h3>
            <p>Altere o subfiltro acima ou limpe os filtros ativos para visualizar toda a carteira.</p>
          </div>
        ` : `
          <div class="table-container">
            <table class="data-table" aria-label="Clientes cadastrados no mês">
              <thead>
                <tr>
                  <th>Cliente / Código</th>
                  <th>Data de cadastro</th>
                  <th>Vendedora responsável</th>
                  <th>Compra no período</th>
                  <th>Primeira compra após cadastro no período</th>
                  <th>Contato / Ação</th>
                </tr>
              </thead>
              <tbody>
                ${clientesVisiveis.map(c => {
                  const dataCadTexto = (simularSemDataCadastro || !c.DataCadastro)
                    ? "Data de cadastro indisponível"
                    : c.DataCadastro;
                  const temCel = Boolean(c.Celular && c.Celular.trim());
                  return `
                    <tr>
                      <td>
                        <strong>${escaparHtml(c.Cliente)}</strong><br/>
                        ${c.RazaoSocial ? `<span style="font-size:0.78rem; color:var(--text-muted);">${escaparHtml(c.RazaoSocial)}</span><br/>` : ''}
                        <span style="font-size:0.78rem; color:var(--text-muted);">Cód. ${escaparHtml(c.CodCliFor)} • Curva ${escaparHtml(c.CurvaABC)}</span>
                      </td>
                      <td><strong>${escaparHtml(dataCadTexto)}</strong></td>
                      <td>${escaparHtml(c.VendedorCarteira)} (${escaparHtml(c.CodVendedorCarteira)})</td>
                      <td>
                        ${c.ComprouNoMes
                          ? `<span class="reason-badge novo">Já comprou no período</span>`
                          : `<span class="reason-badge atencao">Sem compra no período</span>`}
                      </td>
                      <td>
                        ${c.PrimeiraCompraData
                          ? `<strong>${escaparHtml(c.PrimeiraCompraData)}</strong> • ${formatarReais(c.PrimeiraCompraValor)}`
                          : `<span style="color:var(--text-muted);">Compra após cadastro não identificada</span>`}
                      </td>
                      <td>
                        ${temCel ? `
                          <button type="button" class="btn-whatsapp" style="min-height:36px; padding:6px 12px; font-size:0.82rem;" data-action="abrir-whatsapp-demo" data-cod="${escaparHtml(c.CodCliFor)}">
                            WhatsApp • ${escaparHtml(c.Celular)}
                          </button>
                        ` : `
                          <span style="font-size:0.82rem; color:var(--text-muted);">
                            ${c.Telefone ? `Fixo: ${escaparHtml(c.Telefone)}` : "Contato indisponível"}
                          </span>
                        `}
                      </td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
          ${renderizarListaCartoesClientes(clientesVisiveis, true)}
        `}
        ${renderizarCadastrosForaCarteira()}
      `;
    }

    function renderizarListaCartoesClientes(clientesVisiveis, exibirResponsavelObrigatorio) {
      if (clientesVisiveis.length === 0) {
        return `
          <div class="empty-state">
            <h3>Nenhum cliente encontrado com os filtros selecionados</h3>
            <p>Revise os filtros combinados acima ou clique no botão abaixo para redefinir a busca.</p>
            <button type="button" class="btn-primary-navy" data-action="limpar-filtros">
              Limpar todos os filtros
            </button>
          </div>
        `;
      }

      return `
        <div class="clients-grid">
          ${clientesVisiveis.map(c => renderizarCartaoCliente(c, exibirResponsavelObrigatorio)).join("")}
        </div>
      `;
    }

    function renderizarCartaoCliente(cliente, exibirResponsavelObrigatorio) {
      const avisos = obterAvisosExplicativosCliente(cliente);
      const classeBorda = avisos[0] ? avisos[0].classe : "ativo";
      const difInfo = formatarDiferencaMediaTexto(cliente);
      const temCelular = Boolean(cliente.Celular && cliente.Celular.trim() !== "");
      const whatsappAberto = state.whatsappAbertoCod === cliente.CodCliFor;
      const msgSugerida = gerarMensagemSugerida(cliente, cliente.VendedorCarteira);
      const orcamentosCliente = ORCAMENTOS.filter(o => o.CodCliFor === cliente.CodCliFor);
      const prevendasCliente = PREVENDAS.filter(p => p.CodCliFor === cliente.CodCliFor);

      return `
        <article class="client-card reason-${classeBorda}" id="card-cli-${escaparHtml(cliente.CodCliFor)}">
          <div class="client-top">
            <div class="client-identity">
              <div class="client-name-row">
                <span class="curve-badge curve-${escaparHtml(cliente.CurvaABC)}">Curva ${escaparHtml(cliente.CurvaABC)}</span>
                <h3 class="client-name">${escaparHtml(cliente.Cliente)}</h3>
                <span class="client-code">Cód. ${escaparHtml(cliente.CodCliFor)}</span>
                ${exibirResponsavelObrigatorio ? `
                  <span class="rep-owner-tag">Vendedora: ${escaparHtml(cliente.VendedorCarteira)}</span>
                ` : ""}
              </div>
              <div class="reason-badges">
                ${avisos.map(av => `<span class="reason-badge ${av.classe}">${escaparHtml(av.texto)}</span>`).join("")}
                ${orcamentosCliente.length > 0 ? `<span class="reason-badge ativo">${orcamentosCliente.length} orçamento(s) em aberto</span>` : ""}
              </div>
            </div>
          </div>

          <div class="client-metrics">
            <div class="c-metric">
              <span>Valor comprado no mês</span>
              <strong>${formatarReais(cliente.FatMesAtual)}</strong>
              <small>${cliente.ComprouNoMes ? "Com compra válida no mês" : "Ainda sem compra neste mês"}</small>
            </div>
            <div class="c-metric">
              <span>Média mensal (12 meses)</span>
              <strong>${formatarReais(cliente.MediaMensal)}</strong>
              <small>Total 12m: ${formatarReais(cliente.TotalPeriodo)}</small>
            </div>
            <div class="c-metric">
              <span>Diferença para a média</span>
              <strong style="color:${cliente.FatMesAtual < cliente.MediaMensal ? "var(--amber)" : "var(--green)"};">
                ${escaparHtml(difInfo.valor)}
              </strong>
              <small>${escaparHtml(difInfo.sub)}</small>
            </div>
            <div class="c-metric">
              <span>Última compra e dias decorridos</span>
              <strong>${escaparHtml(formatarUltimaCompraTexto(cliente))}</strong>
              <small>${cliente.AtivoUltimos2Meses ? "Ativo nos últimos 2 meses" : "Sem compra nos últimos 2 meses"}</small>
            </div>
          </div>

          <div class="client-actions-row">
            ${temCelular ? `
              <button
                type="button"
                class="btn-whatsapp"
                data-action="abrir-whatsapp-demo"
                data-cod="${escaparHtml(cliente.CodCliFor)}"
              >
                <span>Chamar no WhatsApp • ${escaparHtml(cliente.Celular)}</span>
              </button>
            ` : `
              <span class="no-phone-badge">
                ${cliente.Telefone ? `Sem celular • Telefone fixo: ${escaparHtml(cliente.Telefone)}` : "Contato indisponível"}
              </span>
            `}
          </div>

          ${whatsappAberto && temCelular ? `
            <div class="msg-preview-box" role="region" aria-label="Ação de contato manual via WhatsApp">
              <label for="msg-${escaparHtml(cliente.CodCliFor)}">
                Mensagem sugerida para ação humana (editável • sem envio automático):
              </label>
              <textarea id="msg-${escaparHtml(cliente.CodCliFor)}" class="msg-textarea">${escaparHtml(msgSugerida)}</textarea>
              <div class="msg-actions">
                <button type="button" class="btn-primary-navy" data-action="copiar-msg-demo" data-cod="${escaparHtml(cliente.CodCliFor)}">
                  Copiar texto da mensagem
                </button>
                <button type="button" class="btn-whatsapp" data-action="abrir-wa-real" data-cod="${escaparHtml(cliente.CodCliFor)}">Abrir WhatsApp</button>
                <button type="button" class="btn-secondary-outline" data-action="fechar-whatsapp-demo">
                  Fechar
                </button>
                <span id="copy-feedback-${escaparHtml(cliente.CodCliFor)}" style="font-size:0.82rem; font-weight:700; color:var(--green);"></span>
              </div>
            </div>
          ` : ""}

          <details class="client-details" ${atributosPainel('cliente-'+cliente.CodCliFor)}>
            <summary>Ver histórico de compras, cadastro e orçamentos disponíveis</summary>
            <div class="details-body">
              <div class="details-meta-grid">
                <div><strong>Vendedora responsável:</strong> ${escaparHtml(cliente.VendedorCarteira)} (${escaparHtml(cliente.CodVendedorCarteira)})</div>
                <div><strong>Curva ABC (Global):</strong> Curva ${escaparHtml(cliente.CurvaABC)}</div>
                <div><strong>Data de cadastro:</strong> ${state.estadoTela === "sem_data_cadastro" || !cliente.DataCadastro ? "Data de cadastro indisponível" : escaparHtml(cliente.DataCadastro)}</div>
                <div><strong>1ª compra registrada:</strong> ${cliente.PrimeiraCompraData ? `${escaparHtml(cliente.PrimeiraCompraData)} (${formatarReais(cliente.PrimeiraCompraValor)})` : "Primeira compra não identificada no histórico disponível"}</div>
                <div><strong>Rentabilidade (6 meses):</strong> ${formatarPercentual(cliente.RentPerc)}</div><div><strong>Produtos habituais (6 meses):</strong> ${(cliente.ProdutosHabituais || []).map(p => escaparHtml(p.Produto)).join(", ") || "Indisponível"}</div><div><strong>Contato fixo:</strong> ${cliente.Telefone ? escaparHtml(cliente.Telefone) : "Não informado"}</div>
              </div>

              ${orcamentosCliente.length > 0 || prevendasCliente.length > 0 ? `
                <div style="padding:10px; background:#FFFFFF; border:1px solid var(--blue-border); border-radius:var(--radius-sm);">
                  <strong style="color:var(--navy); font-size:0.84rem;">Orçamentos / Pré-vendas em aberto deste cliente (não somados ao faturamento):</strong>
                  <ul style="margin-top:6px; padding-left:18px; font-size:0.84rem;">
                    ${orcamentosCliente.map(o => `<li>Orçamento <strong>${escaparHtml(o.NumMov)}</strong> (${escaparHtml(o.DtMov)}) — ${formatarReais(o.ValorLiquido)} (${o.DiasAberto} dias em aberto)</li>`).join("")}
                    ${prevendasCliente.map(p => `<li>Pré-venda <strong>${escaparHtml(p.NumMov)}</strong> (${escaparHtml(p.DtMov)}) — ${formatarReais(p.ValorLiquido)} (${p.DiasAberto} dias em aberto)</li>`).join("")}
                  </ul>
                </div>
              ` : ""}

              ${cliente.Historico && cliente.Historico.length > 0 ? `
                <table class="history-table" aria-label="Histórico recente de compras do cliente">
                  <thead>
                    <tr>
                      <th>Mês / Referência</th>
                      <th>Documento</th>
                      <th>Valor Faturado</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${cliente.Historico.map(h => `
                      <tr>
                        <td>${escaparHtml(h.mes)}</td>
                        <td>${escaparHtml(h.doc)}</td>
                        <td><strong>${formatarReais(h.valor)}</strong></td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              ` : `
                <p style="font-size:0.85rem; color:var(--text-muted);">
                  Sem compra nos 12 meses analisados.
                </p>
              `}
            </div>
          </details>
        </article>
      `;
    }

    function renderizarGavetaDocumentos(orcamentos, prevendas) {
      if (!state.gavetaDocAberta) return "";
      if (!servidor.documentosDisponiveis[state.gavetaDocAberta]) return '<div class="empty-state">Documentos indisponíveis. Atualize a base para consultar esta lista.</div>';
      const ehOrc = state.gavetaDocAberta === "orcamentos";
      const lista = ehOrc ? orcamentos : prevendas;
      const titulo = ehOrc
        ? "Orçamentos em aberto (Apresentados separadamente — não somados ao faturamento realizado)"
        : "Pré-vendas em aberto (Apresentadas separadamente — não somadas ao faturamento realizado)";

      return `
        <section class="docs-drawer" aria-label="${titulo}">
          <div class="docs-drawer-header">
            <h3>${titulo}</h3>
            <button type="button" class="btn-close-drawer" data-action="fechar-drawer">Fechar lista ✕</button>
          </div>
          ${lista.length === 0 ? `
            <p style="color:var(--text-muted); font-size:0.9rem;">Nenhum documento em aberto para este recorte no momento.</p>
          ` : `
            <div class="docs-list">
              ${lista.map(doc => {
                const nomeCli = ehOrc ? doc.NomeCliFor : doc.Cliente;
                return `
                  <div class="doc-item">
                    <div class="doc-item-top">
                      <span>Nº ${escaparHtml(doc.NumMov)}</span>
                      <span>Emissão: ${escaparHtml(doc.DtMov)}</span>
                    </div>
                    <div class="doc-item-client">${escaparHtml(nomeCli)}</div>
                    <div class="doc-item-footer">
                      <span>Em aberto há <strong>${doc.DiasAberto} ${doc.DiasAberto === 1 ? "dia" : "dias"}</strong></span>
                      <strong style="color:var(--navy);">${formatarReais(doc.ValorLiquido)}</strong>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `}
        </section>
      `;
    }

    function renderizarVisaoSupervisaoOuGestao(tipoPerfil, supervisorObj) {
      // Determina vendedoras autorizadas para o perfil
      let vendedorasAutorizadas = [];
      if (tipoPerfil === "supervisor" && supervisorObj) {
        vendedorasAutorizadas = VENDEDORAS.filter(v => v.IdEquipe === supervisorObj.IdEquipe);
      } else {
        // Gestão: pode ver todas ou filtrar por equipe de supervisor
        vendedorasAutorizadas = state.filtroEquipeGestao === "TODAS"
          ? [...VENDEDORAS]
          : VENDEDORAS.filter(v => v.IdEquipe === state.filtroEquipeGestao);
      }

      // Garante que a vendedora selecionada pertença ao escopo atual
      const vendedoraSelecionadaObj = state.filtroVendedoraEscopo !== "TODAS"
        ? vendedorasAutorizadas.find(v => v.CodVendedor === state.filtroVendedoraEscopo) || null
        : null;

      const vendedorasNoRecorte = vendedoraSelecionadaObj
        ? [vendedoraSelecionadaObj]
        : vendedorasAutorizadas;

      const codsVendedorasRecorte = new Set(vendedorasNoRecorte.map(v => v.CodVendedor));
      const carteiraRecorte = CARTEIRA_CLIENTES.filter(c => codsVendedorasRecorte.has(c.CodVendedorCarteira));

      const tituloEscopo = vendedoraSelecionadaObj
        ? `Vendedora: ${vendedoraSelecionadaObj.Nome}`
        : (tipoPerfil === "supervisor" ? `Toda a minha equipe (${supervisorObj.Nome})` : (state.filtroEquipeGestao === "TODAS" ? "Consolidado Geral GM Limpezas" : `Equipe ${state.filtroEquipeGestao}`));

      return `
        <!-- BARRA DE ESCOPO: ALTERNAR ENTRE TODA A EQUIPE E UMA VENDEDORA -->
        <section class="scope-bar" aria-label="Seleção de equipe e vendedora">
          <div class="scope-bar-title">
            <strong>${tipoPerfil === "supervisor" ? `Supervisão Comercial • ${escaparHtml(supervisorObj.Nome)}` : "Gestão Comercial • Visão Consolidada"}</strong>
            <span>Exibindo dados de: <strong>${escaparHtml(tituloEscopo)}</strong> (${vendedorasNoRecorte.length} ${vendedorasNoRecorte.length === 1 ? "vendedora" : "vendedoras"} • ${carteiraRecorte.length} clientes)</span>
          </div>

          <div class="scope-selectors">
            ${tipoPerfil === "gestao" ? `
              <div class="scope-field">
                <label for="selectEquipeGestao">Supervisor / Equipe:</label>
                <select id="selectEquipeGestao" class="scope-select">
                  <option value="TODAS" ${state.filtroEquipeGestao === "TODAS" ? "selected" : ""}>Todas as equipes</option>
                  ${SUPERVISORES.map(s => `
                    <option value="${escaparHtml(s.IdEquipe)}" ${state.filtroEquipeGestao === s.IdEquipe ? "selected" : ""}>
                      ${escaparHtml(s.Nome)}
                    </option>
                  `).join("")}
                </select>
              </div>
            ` : ""}

            <div class="scope-field">
              <label for="selectVendedoraEscopo">Recorte:</label>
              <select id="selectVendedoraEscopo" class="scope-select">
                <option value="TODAS" ${!vendedoraSelecionadaObj ? "selected" : ""}>
                  ${tipoPerfil === "supervisor" ? "Toda a minha equipe" : "Todas as vendedoras do recorte"}
                </option>
                ${vendedorasAutorizadas.map(v => `
                  <option value="${escaparHtml(v.CodVendedor)}" ${vendedoraSelecionadaObj && vendedoraSelecionadaObj.CodVendedor === v.CodVendedor ? "selected" : ""}>
                    Vendedora: ${escaparHtml(v.Nome)} (${escaparHtml(v.CodVendedor)})
                  </option>
                `).join("")}
              </select>
            </div>
          </div>
        </section>

        <!-- NAVEGAÇÃO DAS 4 ÁREAS DO SUPERVISOR -->
        <nav class="role-nav" aria-label="Áreas da supervisão comercial">
          <button type="button" class="role-nav-btn ${state.areaSupervisor === "visao_geral" ? "active" : ""}" data-action="mudar-area-sup" data-area="visao_geral">
            1. Visão geral
          </button>
          <button type="button" class="role-nav-btn ${state.areaSupervisor === "desempenho" ? "active" : ""}" data-action="mudar-area-sup" data-area="desempenho">
            2. Desempenho das vendedoras (${vendedorasAutorizadas.length})
          </button>
          <button type="button" class="role-nav-btn ${state.areaSupervisor === "carteira_geral" ? "active" : ""}" data-action="mudar-area-sup" data-area="carteira_geral">
            3. Carteira geral da equipe (${carteiraRecorte.length})
          </button>
          <button type="button" class="role-nav-btn ${state.areaSupervisor === "metas" ? "active" : ""}" data-action="mudar-area-sup" data-area="metas">
            4. Metas (${formatarCompetenciaLegivel(state.competencia)})
          </button>
        </nav>

        ${state.avisoSupervisor ? `
          <div class="feedback-toast ${state.avisoSupervisor.tipo}" role="status">
            ${escaparHtml(state.avisoSupervisor.texto)}
          </div>
        ` : ""}

        ${state.areaSupervisor === "visao_geral"
          ? (vendedoraSelecionadaObj
              ? renderizarVisaoVendedora(vendedoraSelecionadaObj, true)
              : renderizarArea1VisaoGeralEquipe(vendedorasNoRecorte, carteiraRecorte, tituloEscopo))
          : ""}

        ${state.areaSupervisor === "desempenho"
          ? renderizarArea2DesempenhoVendedoras(vendedorasAutorizadas)
          : ""}

        ${state.areaSupervisor === "carteira_geral"
          ? renderizarArea3CarteiraGeralEquipe(carteiraRecorte, tituloEscopo)
          : ""}

        ${state.areaSupervisor === "metas"
          ? renderizarArea4MetasEquipe(vendedorasAutorizadas, tituloEscopo)
          : ""}
      `;
    }

    function renderizarArea1VisaoGeralEquipe(vendedorasNoRecorte, carteiraRecorte, tituloEscopo) {
      const cons = calcularConsolidadoVendedoras(vendedorasNoRecorte, state.competencia);
      const totalClientes = carteiraRecorte.length;
