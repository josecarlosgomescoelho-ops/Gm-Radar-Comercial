version: '3.8'

services:
  app:
    build: .
    image: gm-limpeza-analytics:latest
    container_name: gm-analytics
    restart: unless-stopped

    ports:
      - "8501:8501"  # Dashboard de Vendas
      - "8502:8502"  # Radar de Risco
      - "8503:8503"  # Painel de Gestão

    volumes:
      # Volumes persistentes para cache e logs
      - ./cache:/app/cache
      - ./logs:/app/logs
      # Hot reload para desenvolvimento
      - ./dashboards:/app/dashboards
      - ./scripts:/app/scripts

    env_file:
      - .env

    networks:
      - analytics-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  analytics-network:
    driver: bridge
